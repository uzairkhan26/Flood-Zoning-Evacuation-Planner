name: Release

# Start by hand (Actions tab -> Release -> Run workflow) after setting the new version in
# metadata.txt: builds the plugin zip, creates the tag v<version> and publishes a GitHub release.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: v
        run: echo "version=$(grep '^version=' flood_zoning_evacuation_planner/metadata.txt | cut -d= -f2)" >> "$GITHUB_OUTPUT"
      - name: Build zip
        run: python3 scripts/package.py
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists; set a new version in metadata.txt first."; exit 1
          fi
          gh release create "v$VERSION" dist/*.zip --target "$GITHUB_SHA" \
            --title "Version $VERSION" --notes-file .github/release_notes.md
