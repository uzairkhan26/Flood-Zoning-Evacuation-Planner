name: Release

# Push a tag like v1.0.0 to build the plugin zip and publish a GitHub release with it.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check that the tag matches metadata.txt
        run: |
          v=$(grep '^version=' flood_zoning_evacuation_planner/metadata.txt | cut -d= -f2)
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} does not match version $v"; exit 1; }
      - name: Build zip
        run: python3 scripts/package.py
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.zip \
            --title "Version ${GITHUB_REF_NAME#v}" --notes-file .github/release_notes.md
